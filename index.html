<!DOCTYPE html>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E40AF', // Blue-700
                        secondary: '#DB2777', // Pink-600
                        accent: '#F59E0B', // Amber-500
                        background: '#F3F4F6', // Gray-100
                        textDark: '#1F2937', // Gray-800
                        textLight: '#6B7280', // Gray-500
                    }
                }
            }

    <style>
        .loader {
            border-top-color: #3498db;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        [x-cloak] {
            display: none !important;
        }

        /* Additional style for product images to ensure consistency if needed */
        .product-image {
            width: 100%;
            height: 200px; /* Or your desired height */
            object-fit: cover; /* Ensures the image covers the area without distortion */

        function setupMockFirebase() {
            console.log("Setting up Mock Firebase for local development.");
            // Mock Firebase objects (simplified)
            const mockAuthModule = {
                currentUser: null,
                _users: {}, // email: { password, name, uid, email }

                createUserWithEmailAndPassword: async (authInstance, email, password) => {

                     if(mockAuthModule._onAuthStateChangedCallback) mockAuthModule._onAuthStateChangedCallback(user);

            const mockDbModule = {
                _data: {}, // { collectionName: { docId: data } }
                collection: (dbInstance, name) => ({ 
                    _name: name, 
                    _db: mockDbModule 
                }),
                doc: (dbInstanceOrColRef, path, ...pathSegments) => {
                    let colName, docId;
                    if (typeof dbInstanceOrColRef._name === 'string') { // It's a collection reference
                        colName = dbInstanceOrColRef._name;
                        docId = path; // path is docId here
                    } else { // It's the db instance
                        colName = path;
                        docId = pathSegments[0];

        function displayProducts(productArray = products, searchTerm = '', sortOption = 'default') {
            const productListEl = document.getElementById('product-list');
            if (!productListEl) return;

            let filteredProducts = productArray;

            if (searchTerm) {
                searchTerm = searchTerm.toLowerCase();
                filteredProducts = filteredProducts.filter(p =>
                    p.name.toLowerCase().includes(searchTerm) ||
                    p.description.toLowerCase().includes(searchTerm) ||
                    (p.category && p.category.toLowerCase().includes(searchTerm))
                );
            }
            
            // Sort products
            switch (sortOption) {
                case 'name-asc':
                    filteredProducts.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                case 'name-desc':
                    filteredProducts.sort((a, b) => b.name.localeCompare(a.name));
                    break;
                case 'price-asc':
                    filteredProducts.sort((a, b) => a.price - b.price);
                    break;
                case 'price-desc':
                    filteredProducts.sort((a, b) => b.price - a.price);
                    break;
                // default: no specific sort needed beyond original/Firestore order
            }


            productListEl.innerHTML = ''; // Clear previous products
            if (filteredProducts.length === 0) {
                productListEl.innerHTML = '<p class="col-span-full text-center text-textLight">No products found matching your criteria.</p>';
            } else {

        // Cart Functions
        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            if (cartCountEl) cartCountEl.textContent = count;
        }

        function addToCart(productId, quantity = 1) {
            const product = products.find(p => p.id === productId) || (currentProductDetails && currentProductDetails.id === productId ? currentProductDetails : null) ;
            if (!product) {
                showMessage("Error", "Product not found.", true);
                return;
            }

            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                cart.push({ ...product, quantity });
            }
            updateCartCount();
            saveCart();
            showMessage("Added to Cart", `${product.name} has been added to your cart.`);
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartCount();
            saveCart();
            renderCartPageContents(); // Re-render cart items
            showMessage("Cart Updated", "Item removed from cart.");
        }

        function updateCartItemQuantity(productId, quantity) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity = Math.max(0, quantity); // Ensure quantity is not negative
                if (item.quantity === 0) {
                    removeFromCart(productId); // Remove if quantity becomes zero
                } else {
                    updateCartCount();
                    saveCart();
                    renderCartPageContents(); // Re-render cart items
                }
            }
        }
        
        function saveCart() {
            // Save to local storage for guest users or if Firebase is not available
            localStorage.setItem('guestCart', JSON.stringify(cart));
            // If user is logged in and Firebase is available, save to Firestore
            if (auth && auth.currentUser && db && !db._mock) {
                saveCartToFirestore(auth.currentUser.uid);
            }
        }

        async function saveCartToFirestore(userId) {
            try {
                const userCartRef = doc(db, "userCarts", userId);
                await setDoc(userCartRef, { items: cart, updatedAt: Timestamp.now(db) }); // Use Timestamp.now(db) for mock compatibility
                console.log("Cart saved to Firestore for user:", userId);
            } catch (error) {
                console.error("Error saving cart to Firestore:", error);
                showMessage("Cart Sync Error", "Could not sync your cart with the cloud.", true);
            }
        }
        
        function loadCart() {
            const guestCartJson = localStorage.getItem('guestCart');
            if (guestCartJson) {
                cart = JSON.parse(guestCartJson);
            } else {
                cart = [];
            }
            // If user is logged in and Firebase available, try loading from Firestore
            // This will override local cart if Firestore cart exists
            if (auth && auth.currentUser && db && !db._mock) {
                loadCartFromFirestore(auth.currentUser.uid); // This is async, cart may update after initial load
            } else {
                 updateCartCount(); // Update count from local storage if no Firebase
            }
        }

        async function loadCartFromFirestore(userId) {
            try {
                const userCartRef = doc(db, "userCarts", userId);
                const docSnap = await getDoc(userCartRef);
                if (docSnap.exists()) {
                    cart = docSnap.data().items || [];
                    console.log("Cart loaded from Firestore for user:", userId);
                } else {
                    console.log("No cart found in Firestore for user, local cart (if any) will be used and then saved to Firestore.");
                    // If a guest cart existed, it's already in `cart`. Now save it to Firestore for this new/returning user.
                    await saveCartToFirestore(userId);
                }
            } catch (error) {
                console.error("Error loading cart from Firestore:", error);
                // Keep local cart as fallback
            } finally {
                updateCartCount(); // Update UI with cart from Firestore or merged cart
                if (getCurrentPageId() === 'cart') renderCartPageContents(); // Re-render if on cart page
            }
        }

        async function loadOrderHistory(userId) {
            const container = document.getElementById('order-history-container');
            if (!container) return;
            
            if (!db || db._mock || !userId) { // Check for mock db or missing userId
                container.innerHTML = '<p class="text-textLight">Order history is unavailable in mock mode or if not logged in.</p>';
                return;
            }

            showLoading(true);
            container.innerHTML = ''; // Clear previous
            try {
                const ordersRef = collection(db, "orders");
                // Firestore queries require an index for compound queries (e.g., where + orderBy)
                // For simplicity, we'll just query by userId and sort client-side if needed, or add orderBy('createdAt') if indexed.
                const q = query(ordersRef, where("userId", "==", userId), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    container.innerHTML = '<p class="text-textLight">You have no past orders.</p>';
                } else {
                    const orderItemTemplate = document.getElementById('order-item-card');
                    querySnapshot.forEach(docSnap => {
                        const order = docSnap.data();
                        const orderCard = orderItemTemplate.content.cloneNode(true);
                        orderCard.querySelector('.order-id').textContent = docSnap.id;
                        // Ensure order.createdAt is a Firestore Timestamp, then convert
                        let orderDate = 'N/A';
                        if (order.createdAt && typeof order.createdAt.toDate === 'function') {
                            orderDate = order.createdAt.toDate().toLocaleDateString();
                        } else if (order.createdAt) { // Handle ISO string from mock or older data
                            orderDate = new Date(order.createdAt).toLocaleDateString();
                        }
                        orderCard.querySelector('.order-date').textContent = orderDate;
                        orderCard.querySelector('.order-total').textContent = `$${order.totalAmount.toFixed(2)}`;
                        
                        const productsListEl = orderCard.querySelector('.order-products-list');
                        order.items.forEach(item => {
                            const p = document.createElement('p');
                            p.className = 'text-sm text-gray-600';
                            p.textContent = `${item.name} (x${item.quantity}) - $${(item.price * item.quantity).toFixed(2)}`;
                            productsListEl.appendChild(p);
                        });
                        container.appendChild(orderCard);
                    });
                }
            } catch (error) {
                console.error("Error fetching order history:", error);
                container.innerHTML = '<p class="text-red-500">Could not load order history.</p>';
                showMessage("Error", "Failed to load your order history.", true);
            } finally {
                showLoading(false);
            }
        }

                    break;

        // Gemini AI Functions
        async function callGeminiAPI(prompt) {
            if (GEMINI_API_KEY === "__app_id" || !GEMINI_API_KEY) {
                console.warn("Gemini API Key is placeholder or missing. Returning mock response.");
                 return Promise.resolve("This is a mock AI response as the API key is not configured. Gemini would normally provide a detailed answer here.");
            }

            showLoading(true);
            const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_API_KEY}`;
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                if (!response.ok) {
                    const errorData = await response.json();
                    console.error("Gemini API Error:", errorData);
                    throw new Error(`Gemini API request failed with status ${response.status}: ${errorData?.error?.message || 'Unknown error'}`);
                }
                const data = await response.json();
                if (data.candidates && data.candidates.length > 0 && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts.length > 0) {
                    return data.candidates[0].content.parts[0].text;
                } else {
                    // Handle cases where the response structure is not as expected (e.g., safety blocks)
                    if(data.promptFeedback && data.promptFeedback.blockReason) {
                         throw new Error(`Content blocked by Gemini due to: ${data.promptFeedback.blockReason}`);
                    }
                    console.warn("Gemini API response format unexpected:", data);
                    throw new Error("Could not extract text from Gemini response.");
                }
            } catch (error) {
                console.error("Error calling Gemini API:", error);
                showMessage("AI Error", `Could not get a response from AI: ${error.message}`, true);
                return null; // Or a default error message string
            } finally {
                showLoading(false);
            }
        }

        function getMonthNameShort(month) {

        async function plansGetPlans() {
            const { data, error } = await supabase.from('plans').select('*').eq('is_active', true).order('hierarchy_order');
            if (error) throw error;
            return data;
        }

        async function plansGetUserSubscription(userId) {
            const { data, error } = await supabase.from('user_subscriptions').select('*, plan:plans(*)').eq('user_id', userId).maybeSingle();
            if (error) throw error;
            return data;
        }

        async function plansCreateSubscription(userId, planId, isTrial) {
            const trialEndsAt = isTrial ? new Date(Date.now() + 30*24*60*60*1000).toISOString() : null;
            const { data, error } = await supabase.from('user_subscriptions').insert({
                user_id: userId, plan_id: planId,
                status: isTrial ? 'trial' : 'active',
                trial_ends_at: trialEndsAt,
                current_period_start: new Date().toISOString(),
                current_period_end: new Date(Date.now() + 30*24*60*60*1000).toISOString(),
            }).select('*, plan:plans(*)').single();
            if (error) throw error;
            return data;
        }

        async function plansUpdateAutoScale(userId, enabled) {
            const { error } = await supabase.from('user_subscriptions').update({ auto_scale_enabled: enabled, updated_at: new Date().toISOString() }).eq('user_id', userId);
            if (error) throw error;
        }

        async function plansGetMetrics(userId) {
            const { data, error } = await supabase.from('monthly_sales_metrics').select('*').eq('user_id', userId).order('year', { ascending: false }).order('month', { ascending: false }).limit(6);
            if (error) throw error;

        function buildMyPlanHTML(userSub, plans, metrics, changeLog, pendingDiscount, settings) {
            const currentPlan = userSub.plan;
            const nextPlan = plans.find(p => p.hierarchy_order === (currentPlan?.hierarchy_order || 0) + 1);
            const now = new Date();
            const currentMetrics = metrics.find(m => m.year === now.getFullYear() && m.month === now.getMonth() + 1);
            const salesAmount = currentMetrics?.total_amount || 0;
            const maxSales = currentPlan?.max_monthly_sales_amount || 1;
            const salesPct = Math.min(100, Math.round((salesAmount / maxSales) * 100));
            const warningThreshold = settings?.warning_threshold_percentage || 80;

                const currentEnabled = e.currentTarget.dataset.enabled === 'true';
                const newEnabled = !currentEnabled;
                try {
                    await plansUpdateAutoScale(user.uid, newEnabled);
                    e.currentTarget.dataset.enabled = String(newEnabled);
                    e.currentTarget.className = `relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${newEnabled ? 'bg-blue-600' : 'bg-gray-200'}`;
                    e.currentTarget.querySelector('span').className = `inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${newEnabled ? 'translate-x-6' : 'translate-x-1'}`;

            });

                const discountId = e.target.dataset.discountId;
                e.target.disabled = true;
                try {
                    await plansRespondDiscount(discountId, true);
                    const banner = e.target.closest('.bg-amber-50');
                    if (banner) banner.innerHTML = '<p class="text-green-700 font-semibold text-center py-2">Descuento aplicado. Se verá reflejado en tu próximo cobro.</p>';

            });

                const discountId = e.target.dataset.discountId;
                e.target.disabled = true;

                    await plansRespondDiscount(discountId, false);
                    const banner = e.target.closest('.bg-amber-50');
                    if (banner) banner.innerHTML = '<p class="text-gray-500 text-center py-2">Descuento rechazado. Seguimos con vos.</p>';

        function attachAdminEvents(plans, settings, user) {
            document.getElementById('inflation-pct')?.addEventListener('input', (e) => {
                const pct = parseFloat(e.target.value) || 0;
                document.querySelectorAll('.preview-new-price').forEach(el => {
                    const current = parseInt(el.dataset.current) || 0;
                    el.textContent = formatARS(Math.round(current * (1 + pct/100)));
                });
            });

            document.getElementById('apply-inflation-btn')?.addEventListener('click', async () => {
                const pct = parseFloat(document.getElementById('inflation-pct')?.value || '5');
                const notes = document.getElementById('inflation-notes')?.value || '';
                const paidPlans = plans.filter(p => !p.is_free_trial);
                if (isNaN(pct) || pct <= 0) { showMessage('Error', 'Ingresa un porcentaje valido.', true); return; }
                if (!confirm(`Confirmas aplicar un ajuste del ${pct}% a ${paidPlans.length} planes?`)) return;
                const btn = document.getElementById('apply-inflation-btn');
                btn.disabled = true; btn.textContent = 'Aplicando...';
                try {
                    for (const plan of paidPlans) {
                        const newPrice = Math.round(plan.price_ars * (1 + pct/100));
                        await plansApplyInflation(plan.id, newPrice, plan.price_ars, pct, user.uid, notes);
                    }
                    showMessage('Precios actualizados', `Se aplicó el ajuste del ${pct}% a todos los planes.`);
                    setTimeout(() => navigateTo('admin'), 1500);
                } catch (err) {
                    btn.disabled = false; btn.textContent = 'Aplicar ajuste de precios';
                    showMessage('Error', err.message, true);
                }
            });

            document.getElementById('admin-settings-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const newSettings = {
                    months_to_downgrade: parseInt(fd.get('months_to_downgrade')),
                    loyalty_months_threshold: parseInt(fd.get('loyalty_months_threshold')),
                    loyalty_discount_percentage: parseInt(fd.get('loyalty_discount_percentage')),
                    loyalty_discount_duration_months: parseInt(fd.get('loyalty_discount_duration_months')),
                    warning_threshold_percentage: parseInt(fd.get('warning_threshold_percentage')),
                };
                const btn = e.target.querySelector('[type="submit"]');
                btn.disabled = true; btn.textContent = 'Guardando...';
                try {
                    await plansUpdateSettings(newSettings);
                    btn.textContent = 'Guardado!';
                    setTimeout(() => { btn.disabled = false; btn.textContent = 'Guardar configuracion'; }, 2000);
                } catch (err) {
                    btn.disabled = false; btn.textContent = 'Guardar configuracion';
                    showMessage('Error', err.message, true);
                }
            });

            document.querySelectorAll('[data-send-discount]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const modal = document.getElementById('discount-modal');
                    const userInput = document.getElementById('discount-target-user');
                    const planSelect = document.getElementById('discount-plan-select');
                    if (modal && userInput) {
                        userInput.value = btn.dataset.sendDiscount;
                        if (planSelect && btn.dataset.planId) planSelect.value = btn.dataset.planId;
                        modal.classList.remove('hidden');
                    }
                });
            });

            document.getElementById('close-discount-modal')?.addEventListener('click', () => {
                document.getElementById('discount-modal')?.classList.add('hidden');
            });

            document.getElementById('discount-form')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const userId = document.getElementById('discount-target-user')?.value;
                const planId = document.getElementById('discount-plan-select')?.value;
                const pct = parseInt(document.getElementById('discount-pct-input')?.value || '30');
                const duration = parseInt(document.getElementById('discount-duration-input')?.value || '3');
                const message = document.getElementById('discount-message-input')?.value || '';
                const btn = e.target.querySelector('[type="submit"]');
                btn.disabled = true; btn.textContent = 'Enviando...';
                try {
                    await plansCreateLoyaltyDiscount(userId, planId, pct, duration, message);
                    document.getElementById('discount-modal')?.classList.add('hidden');
                    showMessage('Descuento enviado', 'El usuario vera el descuento disponible en su panel.');
                    btn.disabled = false; btn.textContent = 'Enviar';
                } catch (err) {
                    btn.disabled = false; btn.textContent = 'Enviar';
                    showMessage('Error', err.message, true);
                }
            });
        }

        // Expose navigateTo to window for use in modules
        window.navigateTo = navigateTo;

        // Initialization
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            if(currentYearEl) currentYearEl.textContent = new Date().getFullYear();

            const firebaseInitialized = initializeFirebase(); // Initialize Firebase or mocks

            setupEventListeners();
            loadCart(); // Load cart (from local or trigger Firestore load if user logged in via onAuthStateChanged)

            if (auth) { // Ensure auth is initialized (even if mock)
                 // Use globally scoped onAuthStateChanged
                onAuthStateChanged(auth, async (user) => {
                    updateAuthUI(user);
                    if (user) {
                        console.log("User is logged in:", user.uid);
                        await loadCartFromFirestore(user.uid); // Load/sync cart after login
                        // Check if user was on a page that needs auth, or redirect from login/register
                        const currentPage = getCurrentPageId();
                        if (currentPage === 'login' || currentPage === 'register') {
                            navigateTo('home');
                        }
                    } else {
                        console.log("User is logged out.");
                        loadCart(); // Load guest cart if any
                         // If on a protected page like 'profile', redirect
                        if (getCurrentPageId() === 'profile') {
                            navigateTo('home');
                        }
                    }
                });
            } else {
                console.error("Auth module not initialized. Auth features will not work.");
                updateAuthUI(null); // Ensure UI reflects logged-out state
                loadCart(); // Fallback to guest cart
            }


            await fetchProducts(); // Fetch products after Firebase/mocks are ready

            const urlParams = new URLSearchParams(window.location.search);
            const checkoutStatus = urlParams.get('checkout');
            if (checkoutStatus === 'success') {
                history.replaceState({}, '', window.location.pathname);
                navigateTo('my-plan');
                setTimeout(() => {
                    const msg = document.createElement('div');
                    msg.className = 'fixed top-4 right-4 bg-green-600 text-white px-6 py-3 rounded-xl shadow-lg z-50 text-sm font-semibold';
                    msg.textContent = 'Suscripcion iniciada. Tu primer mes es gratis.';
                    document.body.appendChild(msg);
                    setTimeout(() => msg.remove(), 5000);
                }, 300);
            } else if (checkoutStatus === 'cancelled') {
                history.replaceState({}, '', window.location.pathname);
                navigateTo('plans');
            } else {
                navigateTo('home'); // Initial page load
            }
        });

    </script>
</body>
</html>
